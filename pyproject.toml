[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "load-testing-automation-framework"
version = "0.1.0"
description = "Reproducible API load tests, a bottleneck diagnosis, and measured evidence"
authors = [{name = "Pavel Zhukov Atum"}]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "locust>=2.43,<3", "httpx>=0.28,<1", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools]
packages = ["app", "loadtest", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
tools = ["report.html"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
